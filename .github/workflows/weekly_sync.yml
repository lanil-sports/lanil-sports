name: Daily Louisiana Sports Ingestion & Sync

on:
  schedule:
    # Runs every day at 6:00 AM CST / 7:00 AM CDT (12:00 UTC).
    - cron: '0 12 * * *'
  # Allows you to click "Run workflow" manually from GitHub anytime.
  workflow_dispatch:

# Prevent overlapping ingestion runs (scheduled vs manual).
concurrency:
  group: ${{ github.workflow }}-ingestion
  cancel-in-progress: true

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Louisiana Sports Ingestion
        run: node scripts/ingest_sports.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
